name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore telegram-referral-bot.slnx

      - name: Build
        run: dotnet build telegram-referral-bot.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test telegram-referral-bot.slnx --configuration Release --no-build --verbosity normal
